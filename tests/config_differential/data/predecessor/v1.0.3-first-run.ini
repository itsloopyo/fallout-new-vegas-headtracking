; HeadTracking Configuration
; Auto-generated with default values

[Network]
; UDP port for OpenTrack data (default: 4242)
Port=4242

[Sensitivity]
; Multipliers for each axis (-5.0 to 5.0, negative inverts)
Yaw=1
Pitch=1
Roll=1

[Smoothing]
; Smoothing amount (0.0 = instant, 0.99 = very slow)
Amount=0

[Limits]
; Maximum rotation angles in degrees
MaxYaw=180
MaxPitch=89
MaxRoll=45

[Deadzone]
; Deadzone thresholds in degrees (0.0 to 30.0)
Yaw=0.5
Pitch=0.5
Roll=0.5

[Hotkeys]
; Virtual key codes in hex (Home=0x24, End=0x23)
Recenter=0x24
Toggle=0x23
DebounceMs=200

[GameState]
; InputBlockMode: 0=Never, 1=MenusOnly, 2=AllDialogue, 3=AllOverlays
InputBlockMode=3
TrackInThirdPerson=1
TrackInVATS=0
PauseDuringCombat=0

[Feedback]
ShowMessages=1

[Camera]
; Mode: 0=Coupled (affects aim), 1=Decoupled (free-look), 2=BodyTracking
Mode=0
