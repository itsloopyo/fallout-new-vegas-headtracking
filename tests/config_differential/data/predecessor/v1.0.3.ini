; HeadTracking NVSE Plugin Configuration
; Place this file alongside HeadTracking.dll in Data/NVSE/Plugins/

[Network]
; UDP port for OpenTrack data (default: 4242)
; Must match OpenTrack output configuration
Port=4242

[Sensitivity]
; Sensitivity multipliers for each axis
; 1.0 = 1:1 mapping (1 degree head rotation = 1 degree camera rotation)
; Use negative values to invert axis
Yaw=1.0
Pitch=1.0
Roll=1.0

[Smoothing]
; Smoothing factor for camera movement
; 0.0 = no smoothing (direct/raw input)
; 1.0 = maximum smoothing (very slow response)
; Recommended: 0.3-0.6 for smooth but responsive tracking
Amount=0.0

[Hotkeys]
; Virtual key codes for hotkeys (hexadecimal)
;
; Common key codes:
;   F1-F12: 0x70-0x7B (F8=0x77, F9=0x78, F10=0x79, F11=0x7A, F12=0x7B)
;   Home=0x24, End=0x23, Insert=0x2D, Delete=0x2E
;   PageUp=0x21, PageDown=0x22
;   Numpad 0-9: 0x60-0x69
;   Numpad *=0x6A, +=0x6B, -=0x6D, .=0x6E, /=0x6F
;
; WARNING: Avoid keys used by the game!
;   F5 (0x74) = Quicksave
;   F9 (0x78) = Quickload
;   TAB (0x09) = Pip-Boy
;   ESC (0x1B) = Pause menu
;
; Default: Home to recenter, End to toggle
Recenter=0x24
Toggle=0x23

; Debounce time in milliseconds (prevents accidental double-presses)
; Lower values = more responsive but may trigger twice
; Higher values = more forgiving but may feel laggy
; Default: 200ms
DebounceMs=200

[Limits]
; Maximum rotation limits in degrees
; Camera rotation will be clamped to these values
; Set higher values for more freedom of movement
MaxYaw=180
MaxPitch=89
MaxRoll=45

[Deadzone]
; Deadzone in degrees for each axis
; Movements smaller than this will be ignored (reduces jitter)
; Set to 0 to disable deadzone
; Recommended: 0.5-2.0 depending on tracker stability
Yaw=0.0
Pitch=0.0
Roll=0.0

[GameState]
; Input blocking mode - when to disable hotkeys
; 0 = Never (always process hotkeys, even in menus)
; 1 = Menus only (block during pause menu, pipboy, etc.)
; 2 = All dialogue (block during menus AND NPC conversations)
; 3 = All overlays (block during any overlay: menus, console, VATS, etc.)
; Default: 0 (hotkeys always work)
InputBlockMode=0

; Track in third-person camera mode (1=yes, 0=no)
; Default: 1 (head tracking works in both first and third person)
TrackInThirdPerson=1

; Track during VATS (1=yes, 0=no)
; Default: 0 (VATS has its own camera control)
TrackInVATS=0

; Pause tracking during combat (1=yes, 0=no)
; Default: 0 (head tracking continues during combat)
PauseDuringCombat=0

[Feedback]
; Show on-screen messages when toggling/recentering (1=yes, 0=no)
ShowMessages=1

[Camera]
; Camera mode determines how head tracking affects movement
; 0 = Coupled (head tracking moves camera AND crosshair/movement - WORKING)
; 1 = Decoupled/Free-look (uses D3D9 EndScene hook - TESTING)
; 2 = BodyTracking (pitch tracking only, yaw disabled)
;
; Decoupled mode (Mode=1) uses D3D9 EndScene hook to modify camera
; after game rendering is complete. This should allow head tracking
; without affecting movement direction.
;
; Default: 1 (Testing decoupled mode with D3D9 EndScene hook)
Mode=1
