; HeadTracking Configuration
; Auto-generated with default values

[Network]
; UDP port for OpenTrack data (default: 4242)
Port=4242

[Sensitivity]
; Multipliers for each axis (0.1 to 5.0)
Yaw=1
Pitch=1
Roll=1

[Smoothing]
; Smoothing amount (0.0 = instant, 0.99 = maximum smoothing)
Amount=0

[Deadzone]
; Deadzone thresholds in degrees (0.0 to 30.0)
Yaw=0
Pitch=0
Roll=0

[Hotkeys]
; Nav-cluster virtual key codes (hex). Each action also accepts a
; fixed Ctrl+Shift+<letter> chord (T/Y/G/H/U) which is not configurable.
; Home=0x24, End=0x23, PageUp=0x21, PageDown=0x22, Insert=0x2D
Recenter=0x24
Toggle=0x23
CycleTrackingMode=0x21
ReticleToggle=0x22
; Insert (Page Down is taken by ReticleToggle in this mod)
YawModeKey=0x2D
DebounceMs=200

[GameState]
; InputBlockMode: 0=Never, 1=MenusOnly, 2=AllDialogue, 3=AllOverlays
InputBlockMode=0
TrackInThirdPerson=1
TrackInVATS=0
PauseDuringCombat=0

[Feedback]
ShowMessages=1

[Camera]
; Mode: 0=Coupled (affects aim), 1=Decoupled (free-look), 2=BodyTracking
Mode=1
; WorldSpaceYaw: 1 = horizon-locked yaw (default), 0 = camera-local
WorldSpaceYaw=1
