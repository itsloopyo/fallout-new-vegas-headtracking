; HeadTracking Configuration
; Auto-generated with default values

[Network]
; UDP port for OpenTrack data (default: 4242)
Port=4242

[Smoothing]
; Smoothing applied when the tracker runs on this machine (loopback).
; 0 = no smoothing, 1 = heavy. Covers rotation and position.
LocalSmoothing=0
; Smoothing applied when the tracker is a remote device on the network.
; 0 = no smoothing, 1 = heavy. Covers rotation and position.
RemoteSmoothing=0.15

[Hotkeys]
; Nav-cluster virtual key codes (hex). Each action also accepts a
; fixed Ctrl+Shift+<letter> chord (Y/G/H/J) which is not configurable.
; End=0x23, PageUp=0x21, PageDown=0x22, Delete=0x2E; Insert cycles ADS
Toggle=0x23
CycleTrackingMode=0x21
ReticleToggle=0x22
; Delete / Ctrl+Shift+J
YawModeKey=0x2E
DebounceMs=200

[GameState]
; InputBlockMode: 0=Never, 1=MenusOnly, 2=AllDialogue, 3=AllOverlays
InputBlockMode=0
TrackInThirdPerson=1
TrackInVATS=0
PauseDuringCombat=0

[Feedback]
ShowMessages=1

[Camera]
; WorldSpaceYaw: 1 = horizon-locked yaw (default), 0 = camera-local
WorldSpaceYaw=1
; Insert / Ctrl+Shift+U: paused, marker, tracked
ads_mode=paused
